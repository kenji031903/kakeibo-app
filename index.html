<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>かんたん家計簿</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --primary: #3f7fd6;
    --primary-dark: #2f63ab;
    --text: #2b2f36;
    --muted: #6b7280;
    --border: #e2e6ea;
    --danger: #e0554f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    font-size: 1.5rem;
    margin-bottom: 20px;
  }
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 20px;
  }
  form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  form .full { grid-column: 1 / -1; }

  .type-toggle {
    grid-column: 1 / -1;
    display: flex;
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--border);
    margin-bottom: 4px;
  }
  .type-toggle .type-btn {
    flex: 1;
    padding: 10px;
    background: #fff;
    color: var(--muted);
    font-weight: 600;
    font-size: 0.95rem;
    border-radius: 0;
  }
  .type-toggle .type-btn.active[data-type="支出"] { background: var(--danger); color: #fff; }
  .type-toggle .type-btn.active[data-type="収入"] { background: #2E7D32; color: #fff; }

  .category-grid {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px 6px;
    margin-bottom: 4px;
  }
  .category-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: none;
    padding: 2px;
    font-size: 0.72rem;
    color: var(--text);
    font-weight: 500;
  }
  .category-btn .icon-circle {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    color: #fff;
    box-shadow: 0 0 0 3px transparent;
    transition: box-shadow 0.15s ease;
  }
  .category-btn.selected .icon-circle {
    box-shadow: 0 0 0 3px var(--primary-dark);
  }
  .category-btn .cat-label { white-space: nowrap; }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  input, select {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--primary);
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    transition: background 0.15s ease;
  }
  .submit-btn {
    grid-column: 1 / -1;
    background: var(--primary);
    color: #fff;
    padding: 12px;
  }
  .submit-btn:hover { background: var(--primary-dark); }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    text-align: center;
  }
  .summary-item .label {
    display: block;
    color: var(--muted);
    font-size: 0.78rem;
    margin-bottom: 4px;
  }
  .summary-item .amount {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text);
  }
  .summary-item.income .amount { color: #2E7D32; }
  .summary-item.expense .amount { color: var(--danger); }
  .summary-item.balance .amount { color: var(--primary-dark); }
  .summary-item.balance .amount.negative { color: var(--danger); }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  thead th {
    text-align: left;
    color: var(--muted);
    font-weight: 600;
    font-size: 0.78rem;
    padding: 6px 8px;
    border-bottom: 2px solid var(--border);
  }
  tbody td {
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  .amount-cell {
    text-align: right;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .category-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.78rem;
    white-space: nowrap;
    font-weight: 600;
  }
  .amount-income { color: #2E7D32; }
  .amount-expense { color: var(--text); }
  .amount-cell.negative { color: var(--danger); }
  .delete-btn {
    background: transparent;
    color: var(--danger);
    font-size: 0.78rem;
    padding: 4px 8px;
  }
  .delete-btn:hover { text-decoration: underline; }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 24px 0;
    font-size: 0.9rem;
  }
  .date-cell { white-space: nowrap; color: var(--muted); }

  .filter-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .filter-row label {
    margin: 0;
    white-space: nowrap;
  }
  .filter-row select {
    width: auto;
    min-width: 140px;
  }

  .chart-row {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .chart-row svg { flex-shrink: 0; }
  .legend {
    flex: 1;
    min-width: 180px;
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 0.85rem;
  }
  .legend li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .legend li:last-child { border-bottom: none; }
  .legend .legend-name {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
  }
  .legend .swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .legend .legend-value {
    text-align: right;
    color: var(--muted);
    white-space: nowrap;
  }
  .legend .legend-value strong {
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .month-cell { white-space: nowrap; color: var(--muted); }

  h2 {
    font-size: 1rem;
    margin: 0 0 14px;
  }

  .sync-status {
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
    margin: -12px 0 20px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>かんたん家計簿</h1>
  <div class="sync-status" id="sync-status">読み込み中...</div>

  <div class="card">
    <form id="expense-form">
      <div class="type-toggle" id="type-toggle">
        <button type="button" class="type-btn active" data-type="支出">支出</button>
        <button type="button" class="type-btn" data-type="収入">収入</button>
      </div>
      <input type="hidden" id="type" value="支出">
      <div class="full">
        <label for="amount">金額(円)</label>
        <input type="number" id="amount" min="0" step="1" placeholder="1000" required>
      </div>
      <div class="full">
        <label>カテゴリ</label>
        <div class="category-grid" id="category-grid"></div>
        <input type="hidden" id="category">
      </div>
      <div class="full">
        <label for="date">日付</label>
        <input type="date" id="date" required>
      </div>
      <button type="submit" class="submit-btn">追加する</button>
    </form>
  </div>

  <div class="card">
    <div class="filter-row">
      <label for="month-filter">表示する期間</label>
      <select id="month-filter">
        <option value="all">すべての期間</option>
      </select>
    </div>
    <div class="summary-grid">
      <div class="summary-item income">
        <span class="label">収入</span>
        <span class="amount" id="income-amount">¥0</span>
      </div>
      <div class="summary-item expense">
        <span class="label">支出</span>
        <span class="amount" id="expense-amount">¥0</span>
      </div>
      <div class="summary-item balance">
        <span class="label">収支</span>
        <span class="amount" id="balance-amount">¥0</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>支出のカテゴリ別内訳</h2>
    <div class="chart-row" id="chart-row">
      <svg id="category-chart" width="180" height="180" viewBox="0 0 200 200"></svg>
      <ul class="legend" id="category-legend"></ul>
    </div>
    <div class="empty" id="chart-empty" style="display:none;">この期間の記録がありません</div>
  </div>

  <div class="card">
    <h2>月別の合計</h2>
    <table>
      <thead>
        <tr>
          <th>年月</th>
          <th style="text-align:right;">収入</th>
          <th style="text-align:right;">支出</th>
          <th style="text-align:right;">収支</th>
        </tr>
      </thead>
      <tbody id="month-summary"></tbody>
    </table>
    <div class="empty" id="month-empty" style="display:none;">まだ記録がありません</div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>日付</th>
          <th>カテゴリ</th>
          <th style="text-align:right;">金額</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="expense-list"></tbody>
    </table>
    <div class="empty" id="empty-message" style="display:none;">まだ記録がありません</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
  // 2人で共有したい場合は、Firebaseコンソール(https://console.firebase.google.com/)で
  // 作成したプロジェクトの「firebaseConfig」をここに貼り付けてください。
  // 未設定のまま(apiKeyが"YOUR_API_KEY"のまま)なら、このデバイス内だけで動作します。
  const firebaseConfig = {
    apiKey: "AIzaSyBX_XeKHcUPnZgFuzmchLoAF9o2EgGpAfM",
    authDomain: "hutarinokakeibo-8187a.firebaseapp.com",
    projectId: "hutarinokakeibo-8187a",
    storageBucket: "hutarinokakeibo-8187a.firebasestorage.app",
    messagingSenderId: "818389611992",
    appId: "1:818389611992:web:3cf59ccef7c94246d5aead",
  };

  const STORAGE_KEY = 'kakeibo-expenses';
  const EXPENSE_CATEGORIES = [
    { name: '食費', icon: '🍴', color: '#E53935' },
    { name: '日用品', icon: '🧴', color: '#7CB342' },
    { name: '交通費', icon: '🚃', color: '#1E88E5' },
    { name: '交際費', icon: '☕', color: '#FB8C00' },
    { name: '趣味・娯楽', icon: '🎮', color: '#26A69A' },
    { name: '住居・水道光熱費', icon: '🏠', color: '#6D4C41' },
    { name: '医療費', icon: '➕', color: '#D32F2F' },
    { name: 'その他', icon: '📦', color: '#757575' },
  ];
  const INCOME_CATEGORIES = [
    { name: '給与', icon: '💰', color: '#2E7D32' },
    { name: '賞与', icon: '🎁', color: '#43A047' },
    { name: 'お小遣い', icon: '👛', color: '#5E35B1' },
    { name: '副業', icon: '💼', color: '#00897B' },
    { name: '臨時収入', icon: '🎉', color: '#FBC02D' },
    { name: 'その他', icon: '📦', color: '#757575' },
  ];
  const CATEGORY_COLORS = Object.fromEntries(
    [...EXPENSE_CATEGORIES, ...INCOME_CATEGORIES].map((c) => [c.name, c.color])
  );
  const CATEGORY_ICONS = Object.fromEntries(
    [...EXPENSE_CATEGORIES, ...INCOME_CATEGORIES].map((c) => [c.name, c.icon])
  );
  const DEFAULT_COLOR = '#9CA3AF';

  function getCategoriesForType(type) {
    return type === '収入' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
  }

  const form = document.getElementById('expense-form');
  const typeToggle = document.getElementById('type-toggle');
  const typeInput = document.getElementById('type');
  const amountInput = document.getElementById('amount');
  const categoryGrid = document.getElementById('category-grid');
  const categoryInput = document.getElementById('category');
  const dateInput = document.getElementById('date');
  const monthFilter = document.getElementById('month-filter');
  const listBody = document.getElementById('expense-list');
  const incomeEl = document.getElementById('income-amount');
  const expenseEl = document.getElementById('expense-amount');
  const balanceEl = document.getElementById('balance-amount');
  const emptyMessage = document.getElementById('empty-message');
  const chartSvg = document.getElementById('category-chart');
  const chartLegend = document.getElementById('category-legend');
  const chartRow = document.getElementById('chart-row');
  const chartEmpty = document.getElementById('chart-empty');
  const monthSummaryBody = document.getElementById('month-summary');
  const monthEmpty = document.getElementById('month-empty');
  const syncStatusEl = document.getElementById('sync-status');

  dateInput.value = new Date().toISOString().slice(0, 10);

  function renderCategoryGrid() {
    const categories = getCategoriesForType(typeInput.value);
    if (!categories.some((c) => c.name === categoryInput.value)) {
      categoryInput.value = categories[0].name;
    }

    categoryGrid.innerHTML = '';
    for (const cat of categories) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'category-btn' + (cat.name === categoryInput.value ? ' selected' : '');
      btn.innerHTML = `
        <span class="icon-circle" style="background:${cat.color}">${cat.icon}</span>
        <span class="cat-label">${cat.name}</span>
      `;
      btn.addEventListener('click', () => {
        categoryInput.value = cat.name;
        renderCategoryGrid();
      });
      categoryGrid.appendChild(btn);
    }
  }

  typeToggle.querySelectorAll('.type-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      typeInput.value = btn.dataset.type;
      typeToggle.querySelectorAll('.type-btn').forEach((b) => b.classList.toggle('active', b === btn));
      renderCategoryGrid();
    });
  });

  renderCategoryGrid();

  function loadExpenses() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function persistExpenses() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
    } catch {
      // localStorage unavailable in this environment; keep working in memory only.
    }
  }

  let expenses = loadExpenses();

  function setSyncStatus(text) {
    syncStatusEl.textContent = text;
  }

  let expensesCollection = null;
  const isFirebaseConfigured = firebaseConfig.apiKey !== 'YOUR_API_KEY';

  if (isFirebaseConfigured) {
    try {
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      db.enablePersistence({ synchronizeTabs: true }).catch(() => {
        // multiple tabs or unsupported browser; safe to ignore.
      });
      expensesCollection = db.collection('expenses');

      expensesCollection.onSnapshot(
        (snapshot) => {
          expenses = snapshot.docs.map((doc) => doc.data());
          persistExpenses();
          render();
          setSyncStatus('🟢 2人で同期中');
        },
        (error) => {
          console.error('Firestore sync error', error);
          setSyncStatus('🟡 オフライン(このデバイスの記録のみ表示中)');
        }
      );
    } catch (err) {
      console.error('Firebase init failed', err);
      expensesCollection = null;
      setSyncStatus('⚪ 共有設定エラー。このデバイスのみに保存します');
    }
  } else {
    setSyncStatus('⚪ 共有設定なし(このデバイスのみに保存)');
  }

  function formatYen(value) {
    return '¥' + value.toLocaleString('ja-JP');
  }

  function monthOf(dateStr) {
    return dateStr.slice(0, 7);
  }

  function getFilteredExpenses() {
    if (monthFilter.value === 'all') return expenses;
    return expenses.filter((e) => monthOf(e.date) === monthFilter.value);
  }

  function renderMonthFilterOptions() {
    const months = [...new Set(expenses.map((e) => monthOf(e.date)))].sort().reverse();
    const current = monthFilter.value;

    monthFilter.innerHTML = '<option value="all">すべての期間</option>';
    for (const month of months) {
      const option = document.createElement('option');
      option.value = month;
      option.textContent = month.replace('-', '年') + '月';
      monthFilter.appendChild(option);
    }

    if (current === 'all' || months.includes(current)) {
      monthFilter.value = current;
    } else {
      monthFilter.value = 'all';
    }
  }

  function typeOf(record) {
    return record.type || '支出';
  }

  function renderList(filtered) {
    const sorted = [...filtered].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);

    listBody.innerHTML = '';
    emptyMessage.style.display = sorted.length === 0 ? 'block' : 'none';

    for (const record of sorted) {
      const type = typeOf(record);
      const sign = type === '収入' ? '+' : '-';
      const amountClass = type === '収入' ? 'amount-income' : 'amount-expense';
      const color = CATEGORY_COLORS[record.category] || DEFAULT_COLOR;
      const icon = CATEGORY_ICONS[record.category] || '';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="date-cell">${record.date}</td>
        <td><span class="category-badge" style="background:${color}22; color:${color}">${icon} ${record.category}</span></td>
        <td class="amount-cell ${amountClass}">${sign}${formatYen(record.amount)}</td>
        <td><button class="delete-btn" data-id="${record.id}">削除</button></td>
      `;
      listBody.appendChild(tr);
    }

    const income = filtered.filter((e) => typeOf(e) === '収入').reduce((sum, e) => sum + e.amount, 0);
    const expense = filtered.filter((e) => typeOf(e) === '支出').reduce((sum, e) => sum + e.amount, 0);
    const balance = income - expense;

    incomeEl.textContent = formatYen(income);
    expenseEl.textContent = formatYen(expense);
    balanceEl.textContent = (balance < 0 ? '-' : '') + formatYen(Math.abs(balance));
    balanceEl.classList.toggle('negative', balance < 0);
  }

  function renderCategoryChart(filtered) {
    const expenseOnly = filtered.filter((e) => typeOf(e) === '支出');
    const totalsByCategory = new Map();
    for (const expense of expenseOnly) {
      totalsByCategory.set(expense.category, (totalsByCategory.get(expense.category) || 0) + expense.amount);
    }

    const entries = [...totalsByCategory.entries()].sort((a, b) => b[1] - a[1]);
    const grandTotal = entries.reduce((sum, [, amount]) => sum + amount, 0);

    chartSvg.innerHTML = '';
    chartLegend.innerHTML = '';

    if (grandTotal === 0) {
      chartRow.style.display = 'none';
      chartEmpty.style.display = 'block';
      return;
    }
    chartRow.style.display = 'flex';
    chartEmpty.style.display = 'none';

    const radius = 70;
    const strokeWidth = 32;
    const circumference = 2 * Math.PI * radius;
    let offset = 0;

    for (const [category, amount] of entries) {
      const color = CATEGORY_COLORS[category] || DEFAULT_COLOR;
      const length = (amount / grandTotal) * circumference;

      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', '100');
      circle.setAttribute('cy', '100');
      circle.setAttribute('r', String(radius));
      circle.setAttribute('fill', 'none');
      circle.setAttribute('stroke', color);
      circle.setAttribute('stroke-width', String(strokeWidth));
      circle.setAttribute('stroke-dasharray', `${length} ${circumference - length}`);
      circle.setAttribute('stroke-dashoffset', String(-offset));
      circle.setAttribute('transform', 'rotate(-90 100 100)');
      chartSvg.appendChild(circle);

      offset += length;

      const li = document.createElement('li');
      const percent = ((amount / grandTotal) * 100).toFixed(1);
      li.innerHTML = `
        <span class="legend-name"><span class="swatch" style="background:${color}"></span>${category}</span>
        <span class="legend-value"><strong>${formatYen(amount)}</strong> (${percent}%)</span>
      `;
      chartLegend.appendChild(li);
    }

    const centerText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    centerText.setAttribute('x', '100');
    centerText.setAttribute('y', '105');
    centerText.setAttribute('text-anchor', 'middle');
    centerText.setAttribute('font-size', '18');
    centerText.setAttribute('font-weight', '700');
    centerText.setAttribute('fill', '#2b2f36');
    centerText.textContent = formatYen(grandTotal);
    chartSvg.appendChild(centerText);
  }

  function renderMonthSummary() {
    const totalsByMonth = new Map();
    for (const record of expenses) {
      const month = monthOf(record.date);
      const entry = totalsByMonth.get(month) || { income: 0, expense: 0 };
      if (typeOf(record) === '収入') {
        entry.income += record.amount;
      } else {
        entry.expense += record.amount;
      }
      totalsByMonth.set(month, entry);
    }

    const months = [...totalsByMonth.entries()].sort((a, b) => b[0].localeCompare(a[0]));

    monthSummaryBody.innerHTML = '';
    monthEmpty.style.display = months.length === 0 ? 'block' : 'none';

    for (const [month, { income, expense }] of months) {
      const balance = income - expense;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="month-cell">${month.replace('-', '年')}月</td>
        <td class="amount-cell amount-income">${formatYen(income)}</td>
        <td class="amount-cell amount-expense">${formatYen(expense)}</td>
        <td class="amount-cell${balance < 0 ? ' negative' : ''}">${balance < 0 ? '-' : ''}${formatYen(Math.abs(balance))}</td>
      `;
      monthSummaryBody.appendChild(tr);
    }
  }

  function render() {
    renderMonthFilterOptions();
    const filtered = getFilteredExpenses();
    renderList(filtered);
    renderCategoryChart(filtered);
    renderMonthSummary();
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const amount = Number(amountInput.value);
    if (!amount || amount <= 0 || !dateInput.value) return;

    const expense = {
      id: Date.now(),
      amount,
      category: categoryInput.value,
      date: dateInput.value,
      type: typeInput.value,
    };

    if (expensesCollection) {
      expensesCollection.doc(String(expense.id)).set(expense).catch((err) => {
        console.error('Firestore write failed', err);
      });
    } else {
      expenses.push(expense);
      persistExpenses();
      render();
    }

    amountInput.value = '';
    amountInput.focus();
  });

  listBody.addEventListener('click', (e) => {
    if (!e.target.classList.contains('delete-btn')) return;
    const id = Number(e.target.dataset.id);

    if (expensesCollection) {
      expensesCollection.doc(String(id)).delete().catch((err) => {
        console.error('Firestore delete failed', err);
      });
    } else {
      expenses = expenses.filter((exp) => exp.id !== id);
      persistExpenses();
      render();
    }
  });

  monthFilter.addEventListener('change', () => {
    const filtered = getFilteredExpenses();
    renderList(filtered);
    renderCategoryChart(filtered);
  });

  render();
</script>
</body>
</html>
