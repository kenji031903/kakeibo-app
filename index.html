<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>かんたん家計簿</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --primary: #3f7fd6;
    --primary-dark: #2f63ab;
    --text: #2b2f36;
    --muted: #6b7280;
    --border: #e2e6ea;
    --danger: #e0554f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    font-size: 1.5rem;
    margin-bottom: 20px;
  }
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 20px;
  }
  form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  form .full { grid-column: 1 / -1; }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  input, select {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--primary);
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    transition: background 0.15s ease;
  }
  .submit-btn {
    grid-column: 1 / -1;
    background: var(--primary);
    color: #fff;
    padding: 12px;
  }
  .submit-btn:hover { background: var(--primary-dark); }

  .total-box {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .total-box .label {
    color: var(--muted);
    font-size: 0.95rem;
  }
  .total-box .amount {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--primary-dark);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  thead th {
    text-align: left;
    color: var(--muted);
    font-weight: 600;
    font-size: 0.78rem;
    padding: 6px 8px;
    border-bottom: 2px solid var(--border);
  }
  tbody td {
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  .amount-cell {
    text-align: right;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .category-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    background: #eef3fc;
    color: var(--primary-dark);
    font-size: 0.78rem;
    white-space: nowrap;
  }
  .delete-btn {
    background: transparent;
    color: var(--danger);
    font-size: 0.78rem;
    padding: 4px 8px;
  }
  .delete-btn:hover { text-decoration: underline; }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 24px 0;
    font-size: 0.9rem;
  }
  .date-cell { white-space: nowrap; color: var(--muted); }

  .filter-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .filter-row label {
    margin: 0;
    white-space: nowrap;
  }
  .filter-row select {
    width: auto;
    min-width: 140px;
  }

  .chart-row {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .chart-row svg { flex-shrink: 0; }
  .legend {
    flex: 1;
    min-width: 180px;
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 0.85rem;
  }
  .legend li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .legend li:last-child { border-bottom: none; }
  .legend .legend-name {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
  }
  .legend .swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .legend .legend-value {
    text-align: right;
    color: var(--muted);
    white-space: nowrap;
  }
  .legend .legend-value strong {
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .month-cell { white-space: nowrap; color: var(--muted); }

  h2 {
    font-size: 1rem;
    margin: 0 0 14px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>かんたん家計簿</h1>

  <div class="card">
    <form id="expense-form">
      <div class="full">
        <label for="amount">金額(円)</label>
        <input type="number" id="amount" min="0" step="1" placeholder="1000" required>
      </div>
      <div>
        <label for="category">カテゴリ</label>
        <select id="category">
          <option>食費</option>
          <option>日用品</option>
          <option>交通費</option>
          <option>交際費</option>
          <option>趣味・娯楽</option>
          <option>住居・水道光熱費</option>
          <option>医療費</option>
          <option>その他</option>
        </select>
      </div>
      <div>
        <label for="date">日付</label>
        <input type="date" id="date" required>
      </div>
      <button type="submit" class="submit-btn">追加する</button>
    </form>
  </div>

  <div class="card">
    <div class="filter-row">
      <label for="month-filter">表示する期間</label>
      <select id="month-filter">
        <option value="all">すべての期間</option>
      </select>
    </div>
    <div class="total-box">
      <span class="label">合計金額</span>
      <span class="amount" id="total-amount">¥0</span>
    </div>
  </div>

  <div class="card">
    <h2>カテゴリ別の内訳</h2>
    <div class="chart-row" id="chart-row">
      <svg id="category-chart" width="180" height="180" viewBox="0 0 200 200"></svg>
      <ul class="legend" id="category-legend"></ul>
    </div>
    <div class="empty" id="chart-empty" style="display:none;">この期間の記録がありません</div>
  </div>

  <div class="card">
    <h2>月別の合計</h2>
    <table>
      <thead>
        <tr>
          <th>年月</th>
          <th style="text-align:right;">合計金額</th>
        </tr>
      </thead>
      <tbody id="month-summary"></tbody>
    </table>
    <div class="empty" id="month-empty" style="display:none;">まだ記録がありません</div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>日付</th>
          <th>カテゴリ</th>
          <th style="text-align:right;">金額</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="expense-list"></tbody>
    </table>
    <div class="empty" id="empty-message" style="display:none;">まだ記録がありません</div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'kakeibo-expenses';
  const CATEGORY_COLORS = {
    '食費': '#4C78A8',
    '日用品': '#F58518',
    '交通費': '#54A24B',
    '交際費': '#E45756',
    '趣味・娯楽': '#72B7B2',
    '住居・水道光熱費': '#EECA3B',
    '医療費': '#B279A2',
    'その他': '#9D755D',
  };
  const DEFAULT_COLOR = '#9CA3AF';

  const form = document.getElementById('expense-form');
  const amountInput = document.getElementById('amount');
  const categoryInput = document.getElementById('category');
  const dateInput = document.getElementById('date');
  const monthFilter = document.getElementById('month-filter');
  const listBody = document.getElementById('expense-list');
  const totalEl = document.getElementById('total-amount');
  const emptyMessage = document.getElementById('empty-message');
  const chartSvg = document.getElementById('category-chart');
  const chartLegend = document.getElementById('category-legend');
  const chartRow = document.getElementById('chart-row');
  const chartEmpty = document.getElementById('chart-empty');
  const monthSummaryBody = document.getElementById('month-summary');
  const monthEmpty = document.getElementById('month-empty');

  dateInput.value = new Date().toISOString().slice(0, 10);

  function loadExpenses() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function persistExpenses() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
    } catch {
      // localStorage unavailable in this environment; keep working in memory only.
    }
  }

  let expenses = loadExpenses();

  function formatYen(value) {
    return '¥' + value.toLocaleString('ja-JP');
  }

  function monthOf(dateStr) {
    return dateStr.slice(0, 7);
  }

  function getFilteredExpenses() {
    if (monthFilter.value === 'all') return expenses;
    return expenses.filter((e) => monthOf(e.date) === monthFilter.value);
  }

  function renderMonthFilterOptions() {
    const months = [...new Set(expenses.map((e) => monthOf(e.date)))].sort().reverse();
    const current = monthFilter.value;

    monthFilter.innerHTML = '<option value="all">すべての期間</option>';
    for (const month of months) {
      const option = document.createElement('option');
      option.value = month;
      option.textContent = month.replace('-', '年') + '月';
      monthFilter.appendChild(option);
    }

    if (current === 'all' || months.includes(current)) {
      monthFilter.value = current;
    } else {
      monthFilter.value = 'all';
    }
  }

  function renderList(filtered) {
    const sorted = [...filtered].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);

    listBody.innerHTML = '';
    emptyMessage.style.display = sorted.length === 0 ? 'block' : 'none';

    for (const expense of sorted) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="date-cell">${expense.date}</td>
        <td><span class="category-badge">${expense.category}</span></td>
        <td class="amount-cell">${formatYen(expense.amount)}</td>
        <td><button class="delete-btn" data-id="${expense.id}">削除</button></td>
      `;
      listBody.appendChild(tr);
    }

    const total = filtered.reduce((sum, e) => sum + e.amount, 0);
    totalEl.textContent = formatYen(total);
  }

  function renderCategoryChart(filtered) {
    const totalsByCategory = new Map();
    for (const expense of filtered) {
      totalsByCategory.set(expense.category, (totalsByCategory.get(expense.category) || 0) + expense.amount);
    }

    const entries = [...totalsByCategory.entries()].sort((a, b) => b[1] - a[1]);
    const grandTotal = entries.reduce((sum, [, amount]) => sum + amount, 0);

    chartSvg.innerHTML = '';
    chartLegend.innerHTML = '';

    if (grandTotal === 0) {
      chartRow.style.display = 'none';
      chartEmpty.style.display = 'block';
      return;
    }
    chartRow.style.display = 'flex';
    chartEmpty.style.display = 'none';

    const radius = 70;
    const strokeWidth = 32;
    const circumference = 2 * Math.PI * radius;
    let offset = 0;

    for (const [category, amount] of entries) {
      const color = CATEGORY_COLORS[category] || DEFAULT_COLOR;
      const length = (amount / grandTotal) * circumference;

      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', '100');
      circle.setAttribute('cy', '100');
      circle.setAttribute('r', String(radius));
      circle.setAttribute('fill', 'none');
      circle.setAttribute('stroke', color);
      circle.setAttribute('stroke-width', String(strokeWidth));
      circle.setAttribute('stroke-dasharray', `${length} ${circumference - length}`);
      circle.setAttribute('stroke-dashoffset', String(-offset));
      circle.setAttribute('transform', 'rotate(-90 100 100)');
      chartSvg.appendChild(circle);

      offset += length;

      const li = document.createElement('li');
      const percent = ((amount / grandTotal) * 100).toFixed(1);
      li.innerHTML = `
        <span class="legend-name"><span class="swatch" style="background:${color}"></span>${category}</span>
        <span class="legend-value"><strong>${formatYen(amount)}</strong> (${percent}%)</span>
      `;
      chartLegend.appendChild(li);
    }

    const centerText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    centerText.setAttribute('x', '100');
    centerText.setAttribute('y', '105');
    centerText.setAttribute('text-anchor', 'middle');
    centerText.setAttribute('font-size', '18');
    centerText.setAttribute('font-weight', '700');
    centerText.setAttribute('fill', '#2b2f36');
    centerText.textContent = formatYen(grandTotal);
    chartSvg.appendChild(centerText);
  }

  function renderMonthSummary() {
    const totalsByMonth = new Map();
    for (const expense of expenses) {
      const month = monthOf(expense.date);
      totalsByMonth.set(month, (totalsByMonth.get(month) || 0) + expense.amount);
    }

    const months = [...totalsByMonth.entries()].sort((a, b) => b[0].localeCompare(a[0]));

    monthSummaryBody.innerHTML = '';
    monthEmpty.style.display = months.length === 0 ? 'block' : 'none';

    for (const [month, total] of months) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="month-cell">${month.replace('-', '年')}月</td>
        <td class="amount-cell">${formatYen(total)}</td>
      `;
      monthSummaryBody.appendChild(tr);
    }
  }

  function render() {
    renderMonthFilterOptions();
    const filtered = getFilteredExpenses();
    renderList(filtered);
    renderCategoryChart(filtered);
    renderMonthSummary();
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const amount = Number(amountInput.value);
    if (!amount || amount <= 0 || !dateInput.value) return;

    expenses.push({
      id: Date.now(),
      amount,
      category: categoryInput.value,
      date: dateInput.value,
    });
    persistExpenses();

    amountInput.value = '';
    amountInput.focus();
    render();
  });

  listBody.addEventListener('click', (e) => {
    if (!e.target.classList.contains('delete-btn')) return;
    const id = Number(e.target.dataset.id);
    expenses = expenses.filter((exp) => exp.id !== id);
    persistExpenses();
    render();
  });

  monthFilter.addEventListener('change', () => {
    const filtered = getFilteredExpenses();
    renderList(filtered);
    renderCategoryChart(filtered);
  });

  render();
</script>
</body>
</html>
